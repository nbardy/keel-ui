[package]
name = "kit_winit"
description = "Keel UI kit winit adapter: window events to kit InputEvents, IME and clipboard, plus a runnable starter (scene + UI in one frame)."
keywords = ["gui", "winit", "wgpu", "gamedev", "ui"]
categories = ["gui", "game-development"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kit_core.workspace = true
kit_input.workspace = true
# The versions the Keel game's native host already locks. `rwh_06` gives wgpu a surface; `x11` makes Linux work.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11"] }
# OS clipboard, text only. Exact: 3.6.1 is the game's vetted release (3.7.0 was under two weeks old on 2026-10-15).
arboard = { version = "=3.6.1", default-features = false }

[dev-dependencies]
kit_state.workspace = true
kit_view.workspace = true
kit_layout.workspace = true
kit_paint.workspace = true
kit_widgets.workspace = true
kit_wgpu.workspace = true
wgpu = { version = "30", default-features = false, features = ["metal", "vulkan", "gles", "wgsl"] }
pollster = "0.4"
# PNG encoding for `--snapshot`; already in the lock (via tiny-skia).
png = "0.18"
